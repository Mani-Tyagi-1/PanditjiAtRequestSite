# ─────────────────────────────────────────────────────────────────────────────
# Frontend static-serving config for PanditJiAtRequest (performance-tuned)
#
# Fixes the Lighthouse findings that are server-config (not code):
#   • "Use efficient cache lifetimes" (~973 KiB) → immutable 1-year cache on the
#     content-hashed build assets in /assets/.
#   • Transfer size → gzip (and brotli if the module is available).
#   • Correct SPA + prerendered-landing-page + bots-prerender routing.
#
# Paste the relevant blocks into your existing `server { ... }` for panditjiatrequest.com.
# Adjust `root` to wherever the frontend `dist/` is deployed.
# Reload:  sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name panditjiatrequest.com www.panditjiatrequest.com;

    root /var/www/panditjiatrequest/dist;   # <-- point to your dist/
    index index.html;

    # ── Compression ──────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml application/xml+rss image/svg+xml application/manifest+json;
    # If ngx_brotli is installed, prefer it (better than gzip):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # ── Hashed build assets → cache forever (filenames change on every deploy) ──
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Other static files (favicons, etc.) — a sensible medium cache.
    location ~* \.(?:ico|png|jpg|jpeg|webp|gif|woff2?)$ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";   # 30 days
        try_files $uri =404;
    }

    # SEO files — short cache so updates propagate.
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt    { add_header Cache-Control "public, max-age=3600"; }

    # ── API → Node/Express (already gzipped + cache-headered in code) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Bots-prerender: crawlers for /puja/:id get server-rendered HTML ──
    # (requires the $pjar_is_bot map from server/deploy/nginx-bots-prerender.conf)
    location ~ ^/puja/(?<puja_id>[^/]+)/?$ {
        if ($pjar_is_bot) {
            proxy_pass http://127.0.0.1:8001/api/seo/puja/$puja_id;
            break;
        }
        try_files $uri $uri/index.html /index.html;
    }

    # ── App shell + prerendered landing pages ──
    # $uri/index.html serves dist/pandit/<lang>/<puja>/<city>/index.html directly
    # (no redirect); everything else falls back to the SPA. HTML itself is never
    # cached long, so new deploys are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
