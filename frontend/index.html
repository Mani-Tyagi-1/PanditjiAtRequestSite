  <!-- ═══════════════════════════════════════════════
         GOOGLE CONSENT MODE v2
         MUST stay above the GTM snippet. Tags read the default the instant the
         container loads, so a default declared after it arrives too late and
         the first page_view has already fired ungoverned.

         Granted for everyone, with no banner and no per-region exception.
         There used to be a stricter EEA/UK/CH default plus an opt-out banner
         (see git history for ConsentBanner.tsx and the region list); both were
         removed deliberately so storage is available on the first pageview
         everywhere and no conversion is lost to an unanswered prompt.

         NOTE: this is an opt-out-free posture. It matches India's DPDP Act,
         which does not require prior opt-in, but NOT GDPR/ePrivacy — visitors
         from the EEA, UK and Switzerland now get cookies before consenting. If
         that traffic ever matters, restore the region-scoped 'denied' default
         below and re-add the banner.
    ═══════════════════════════════════════════════ -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    // One default for every visitor, everywhere.
    gtag('consent', 'default', {
      ad_storage: 'granted',
      ad_user_data: 'granted',
      ad_personalization: 'granted',
      analytics_storage: 'granted',
      functionality_storage: 'granted',
      security_storage: 'granted'
    });

    // Keeps click ids on the URL when ad_storage is denied, so a conversion can
    // still be attributed without a cookie.
    gtag('set', 'url_passthrough', true);
    // Strips ad click identifiers from the tag's own network requests while
    // ad_storage is denied.
    gtag('set', 'ads_data_redaction', true);
  </script>

          'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
    })(window, document, 'script', 'dataLayer', 'GTM-MVRGQH4N');</script>

  <!-- ═══════════════════════════════════════════════
         TYPEFACES
         Cormorant Garamond is referenced by name across the site (Vivah,
         Chadhava, Savan, Kaal Bhairav, BookingModal…) but was never actually
         loaded — those headings had all been falling back to Times New Roman.
         Loading it here fixes every one of them. Inter is the body face for
         the Vedic Vivah pages.

         Cinzel (engraved caps) and DM Sans join them for the Savan/Mahakal
         parchment theme worn by both the puja page and its booking page —
         Cinzel carries their subheadings and seal badges, DM Sans their body
         copy, while buttons stay on Inter. They ride the SAME
         stylesheet request as the two above rather than a second <link>: the
         browser is already blocked on this one, so extra families cost bytes
         but no extra round trip. Weights are pruned to the ones actually used.
    ═══════════════════════════════════════════════ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- NOT render-blocking. As a plain stylesheet this sat in front of first
       paint on a THIRD origin: DNS + TLS + round trip to fonts.googleapis.com
       before the browser would paint a single pixel, and the font files it
       names then need the same again for fonts.gstatic.com. `media="print"`
       makes it a non-blocking fetch; onload promotes it to the real thing.
       Nothing about the type changes — every family already ships
       `display=swap`, so text has always painted in the fallback face and
       swapped on arrival. This only stops the page waiting for the swap to
       become possible. -->
  <link
    rel="stylesheet"
    media="print"
    onload="this.media='all';this.onload=null"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
  />
  <noscript>

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Cinzel:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </noscript>
