# ─────────────────────────────────────────────────────────────────────────────
# Bots-prerender routing for PanditJiAtRequest (Ship #3)
#
# Goal: when a search/AI crawler requests a SPA data page (/puja/:id), serve the
# server-rendered HTML from Express (/api/seo/puja/:id) instead of the empty SPA
# shell. Human users are unaffected — they keep getting the React SPA.
#
# HOW TO INSTALL
#   1. Put the `map` block (below) in the http{} context of nginx.conf
#      (i.e. OUTSIDE any server{} block).
#   2. Put the `location ~ ^/puja/...` block INSIDE your existing server{} block,
#      BEFORE the generic `location /` that serves the SPA.
#   3. Adjust the upstream (127.0.0.1:8001) to wherever the Node/Express app runs.
#   4. Reload: `sudo nginx -t && sudo systemctl reload nginx`
#
# VERIFY (after deploy)
#   # bot UA -> should return real HTML with <h1> and JSON-LD:
#   curl -s -A "Googlebot" https://panditjiatrequest.com/puja/<REAL_ID> | grep -c "<h1"
#   # normal UA -> should return the SPA shell (index.html):
#   curl -s -A "Mozilla/5.0" https://panditjiatrequest.com/puja/<REAL_ID> | grep -c "id=\"root\""
# ─────────────────────────────────────────────────────────────────────────────

# ── 1) http{} context — classify the user-agent ──
map $http_user_agent $pjar_is_bot {
    default                                                                  0;
    "~*googlebot|bingbot|duckduckbot|yandex|baiduspider|applebot"            1;
    "~*gptbot|oai-searchbot|chatgpt-user|perplexitybot|claudebot|anthropic"  1;
    "~*facebookexternalhit|twitterbot|linkedinbot|slackbot|whatsapp|bytespider" 1;
}

# ── 2) server{} context — intercept /puja/:id for bots only ──
# Place this ABOVE `location / { try_files $uri /index.html; }`.
#
# location ~ ^/puja/(?<puja_id>[^/]+)/?$ {
#     # Bots → Express prerender. Humans → fall through to the SPA.
#     if ($pjar_is_bot) {
#         proxy_pass         http://127.0.0.1:8001/api/seo/puja/$puja_id;
#         proxy_set_header   Host              $host;
#         proxy_set_header   X-Real-IP         $remote_addr;
#         proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header   X-Forwarded-Proto $scheme;
#         break;
#     }
#     try_files $uri /index.html;
# }
#
# (The block is commented so this file is safe to `include`. Uncomment the
#  `location` block after pasting it into your server{} — or copy it in directly.)
